[project]
name = "surrogate-manager-backend"
version = "0.1.0"
description = "鋳造解析サロゲートモデルのデータ・タスク管理API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.18.5",
    "fastapi>=0.139.0",
    "numpy>=2.4.6",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.4",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[tool.uv]
package = false

[tool.uv.sources]

[tool.ruff]
line-length = 100
